<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PanicCoin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
      overflow-x: hidden;
    }

    .hero {
      width: 100%;
      height: 450px;
      background-image: url('https://raw.githubusercontent.com/panicpaic-dev/-panic_coin/main/WhatsApp%20Image%202026-08-16%20at%2016.26.38.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      text-shadow: 0 0 20px #000;
    }

    .hero-title {
      font-size: 60px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      margin: 10px;
      background-color: #00ff88;
      color: #000;
      font-weight: bold;
      border-radius: 999px;
      text-decoration: none;
      font-size: 18px;
      transition: 0.25s;
    }

    .btn:hover {
      transform: translateY(-3px);
      background-color: #00e676;
    }

    .desc {
      max-width: 900px;
      margin: 40px auto;
      font-size: 18px;
      line-height: 1.7;
      opacity: 0.9;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,255,150,0.3);
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

<div class="hero">
  <div class="hero-title">PanicCoin</div>
</div>

<div>
  <a class="btn" href="#" target="_blank">BUY</a>
  <a class="btn" href="#" target="_blank">SELL</a>
</div>

<div class="desc">
  PanicCoin is a high‑energy meme token built for chaos, fun, and pure market madness.
</div>

<div class="gallery">
  <img src="https://raw.githubusercontent.com/panicpaic-dev/-panic_coin/main/WhatsApp%20Image%202026-08-16%20at%2016.26.38%20(1).jpeg">
  <img src="https://raw.githubusercontent.com/panicpaic-dev/-panic_coin/main/WhatsApp%20Image%202026-08-16%20at%2016.26.38%20(2).jpeg">
  <img src="https://raw.githubusercontent.com/panicpaic-dev/-panic_coin/main/WhatsApp%20Image%202026-08-16%20at%2016.26.38%20(3).jpeg">
  <img src="https://raw.githubusercontent.com/panicpaic-dev/-panic_coin/main/WhatsApp%20Image%202026-08-16%20at%2016.26.38%20(4).jpeg">
  <img src="https://raw.githubusercontent.com/panicpaic-dev/-panic_coin/main/WhatsApp%20Image%202026-08-16%20at%2016.26.38.jpeg">
  <img src="https://raw.githubusercontent.com/panicpaic-dev/-panic_coin/main/WhatsApp%20Image%202026-08-16%20at%2016.26.40%20(1).jpeg">
  <img src="https://raw.githubusercontent.com/panicpaic-dev/-panic_coin/main/WhatsApp%20Image%202026-08-16%20at%2016.26.40%20(2).jpeg">
  <img src="https://raw.githubusercontent.com/panicpaic-dev/-panic_coin/main/WhatsApp%20Image%202026-08-16%20at%2016.26.40.jpeg">
</div>

</body>
</html>
